[package]
name = "tomos-installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Tom OS Installer: a neon GTK4 system installer for Tom OS"
license = "MIT"
repository = "https://github.com/Spruhantom/tomos-installer2"
readme = "README.md"

[lib]
name = "tomos_installer"
path = "src/lib.rs"

[[bin]]
name = "tomos-installer"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:gtk"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
